# AI_MultiLab 课题组网站配置
# 本地预览：hugo server    正式构建：hugo --minify（GitHub Actions 会自动执行）
baseURL = "/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # 页面上用黄色虚线框标出“待补充”的内容。正式上线、内容补齐后改成 false。
  showTodo = true
  # 页脚显示访客统计（不蒜子）。不需要时改成 false。
  visitCounter = true

# 页面文件夹里的原图默认不发布，只发布模板实际用到的缩小版（WebP）
[[cascade]]
  [cascade.build]
    publishResources = false

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 80

# ---------------------------------------------------------------- 语言
# 中文在网站根目录（/），英文在 /en/。英文页面是同一文件夹里的 *.en.md 文件。
[languages]
  [languages.zh]
    weight = 1
    label = "中文"
    locale = "zh-CN"
    title = "智能赋能多物理场分析与检测实验室"
    [languages.zh.params]
      description = "AI_MultiLab 课题组（东南大学）：多物理场测试系统开发与应用、热工装备设计与优化、智能分析与轻量化部署。"
  [languages.en]
    weight = 2
    label = "English"
    locale = "en"
    title = "AI_MultiLab"
    [languages.en.params]
      description = "AI_MultiLab (Southeast University): multiphysics measurement systems, thermal equipment design and optimization, intelligent analysis and lightweight deployment."

