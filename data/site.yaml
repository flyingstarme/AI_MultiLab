# 首页“课题组简介”
intro: "我们课题组主要从事多物理场测试系统开发与应用、热工装备设计与优化、智能分析与轻量化部署三个方向的研究，致力于打通“精密测量—优化设计—智能分析”的完整链条，欢迎机电、能源与人工智能交叉研究感兴趣的同学来课题组开展研究或攻读学位，也欢迎各位同行交流、合作。"
intro_en: "Our group works on three research directions: development and application of multiphysics measurement systems, design and optimization of thermal equipment, and intelligent analysis with lightweight deployment. We aim to connect the full chain of precision measurement, optimal design and intelligent analysis. Students interested in interdisciplinary research across mechatronics, energy and artificial intelligence are welcome to join us for research or graduate study, and we welcome exchanges and collaboration with colleagues."
